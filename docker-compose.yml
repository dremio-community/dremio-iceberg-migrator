version: '3.8'

services:
  migrator:
    image: mshainman/dremio-iceberg-migrator:latest
    container_name: dremio-iceberg-migrator
    ports:
      - "8771:8771"
    volumes:
      # Mount the local data folder to preserve the SQLite audit ledger
      - ./data:/app/data
    restart: unless-stopped
